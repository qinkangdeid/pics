<?xml version="1.0" encoding="UTF-8"?>
<svg width="64" height="64" viewBox="0 0 70 70" xmlns="http://www.w3.org/2000/svg">
  <!-- Favicon 版本 - 只有图标 -->
  
  <defs>
    <linearGradient id="faviconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5B46E5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 外圈装饰环 -->
  <circle cx="35" cy="35" r="32" fill="none" stroke="url(#faviconGradient)" stroke-width="3" opacity="0.3"/>
  
  <!-- 主图标 - 六边形内的 A -->
  <path d="M 35 8 L 58 20.5 L 58 45.5 L 35 58 L 12 45.5 L 12 20.5 Z" 
        fill="url(#faviconGradient)" 
        opacity="0.95"/>
  
  <!-- A 字母 -->
  <path d="M 25 47 L 35 23 L 45 47 M 29.5 39 L 40.5 39" 
        stroke="#FFFFFF" 
        stroke-width="3.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        fill="none"/>
</svg>
